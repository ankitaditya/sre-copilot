services:
  sre-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sre-copilot:local
    container_name: sre-copilot
    environment:
      ENVIRONMENT: production
      LLM_MODE: ${LLM_MODE:-auto}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_TOKENS: '${AUTH_TOKENS:-{}}'
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      ALLOWED_SERVICES: '${ALLOWED_SERVICES:-["demo-api"]}'
      ALLOWED_TOOLS: '${ALLOWED_TOOLS:-["inspect_demo_service","read_demo_logs","search_runbooks","search_knowledge","http_healthcheck","list_containers","get_container_logs","restore_demo_service","restart_container"]}'
      ALLOWED_HTTP_ORIGINS: '${ALLOWED_HTTP_ORIGINS:-[]}'
      ALLOWED_MODEL_ORIGINS: '${ALLOWED_MODEL_ORIGINS:-["http://127.0.0.1:11434","http://localhost:11434","http://host.docker.internal:11434"]}'
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-}
      KNOWLEDGE_MAX_DOCUMENTS: ${KNOWLEDGE_MAX_DOCUMENTS:-2000}
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-1800}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - sre-copilot-data:/app/data
      - ./sandbox/runtime:/app/sandbox/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  sre-copilot-data:
