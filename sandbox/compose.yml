services:
  demo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sre-copilot-demo-api
    ports:
      - "8080:8080"
    volumes:
      - ./runtime:/runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

